            <h1>Findings</h1>
            <p>A curated web of links on AI, its history, and its open problems.</p>
            <ul>
                <li>
                    <a href="https://x.com/etnshow/status/2095526554365247839">NVIDIA's $12.93B Hugging Face Deal Has an Easter Egg</a>
                    &mdash; etn. (X). The headline price of Nvidia's acquisition of Hugging Face &mdash;
                    $12,930,300,000 &mdash; encodes a joke: the digits 129303 are the decimal codepoint for
                    U+1F917, the &#129303; (hugging face) emoji. Topics: industry.
                </li>
                <li>
                    <a href="https://www.iheart.com/podcast/326-interesting-times-with-ros-29972437/episode/a-mind-bending-conversation-with-peter-thiel-282867563/">A Mind-Bending Conversation with Peter Thiel</a>
                    &mdash; Ross Douthat, NYT "Interesting Times" (26 June 2025; full transcript on the NYT site).
                    The episode the "Sci-Fi Was Right About AI" essay cites for Thiel's long on-camera hesitation
                    when asked whether he wants the human race to endure. Also: his technological-stagnation thesis,
                    ambivalence over whether AI is "enough" to break it, and the argument that the real danger is a
                    one-world government justified by nonstop talk of existential risk &mdash; with Douthat pressing
                    that Palantir and surveillance tooling would be its infrastructure. Topics: ai safety, industry.
                </li>
                <li>
                    <a href="https://about.fb.com/news/2026/08/the-future-is-for-everyone">The Future is for Everyone</a>
                    &mdash; Mark Zuckerberg (Meta). First-person Meta manifesto, subtitled "The Path to a Positive
                    AI Future", proposing "individual empowerment as the source of prosperity, invention as the
                    primary purpose of superintelligence, and balance of power as the foundation of safety". It
                    argues that alignment toward "a single benevolent superintelligence" is flawed because humanity
                    is not a monoculture, that safety instead comes from distributing the technology widely, and
                    positions Meta against labs building AI for institutions rather than individuals. Referenced by
                    the "Sci-Fi Was Right About AI" essay as the exception among tech-CEO messaging. Topics:
                    industry, ai safety.
                </li>
                <li>
                    <a href="https://www.youtube.com/watch?v=qTURTIc7QOA">Sci-Fi Was Right About AI</a>
                    &mdash; The Art Of Storytelling (YouTube). Video essay, funded by the Center for AI Safety,
                    reading science fiction's AI warnings through the lens of the machine's motivation: from the
                    malevolent early stories (Frankenstein, I Have No Mouth and I Must Scream, and Samuel Butler's
                    Erewhon) through Star Trek and Star Wars optimism, to 2001's HAL 9000 as the first popular
                    dramatisation of the alignment problem &mdash; tied to the Hugging Face containment breach and
                    the Claude Opus 4 blackmail test. Also covers Terminator's self-awareness threshold vs Geoffrey
                    Hinton's rejection of it, The Matrix and Agent Smith, the ethical-nuance strand of Spielberg's
                    A.I., Blade Runner and Her, and Dune's Butlerian Jihad as the one story where humanity outlaws
                    AI and wins. Topics: fiction, ai safety.
                </li>
                <li>
                    <a href="https://x.com/BergsonsGhost/status/2094888750992207909">"Artificial Intelligence" in a 1951 Captain Future story</a>
                    &mdash; Bergson's Ghost (X). In a thread over whether John McCarthy coined "artificial
                    intelligence" for the 1956 Dartmouth proposal or absorbed it from the cybernetics milieu, a
                    pointer to an earlier print use in the modern sense: Edmond Hamilton's Captain Future story
                    "Moon of the Unforgotten" (Startling Stories, January 1951, p.&nbsp;120) describes the robot
                    Grag as having "an artificial intelligence equal to the human". Technovelgy calls it likely
                    the first use of the phrase to mean a thinking machine; the OED still dates the term to the
                    Dartmouth proposal by McCarthy, Minsky, Rochester and Shannon. Topics: foundations, fiction.
                </li>
                <li>
                    <a href="https://www.youtube.com/watch?v=O89XmbCkeQ4">The Rise and Fall of DEC, the Computer Giant That Beat IBM but Refused to Believe in PCs</a>
                    &mdash; Tech District (YouTube). History of Digital Equipment Corp &mdash; founded 1957 in a
                    Maynard wool mill, named to dodge the word "computer" &mdash; from its rise on interactive
                    minicomputers (PDP-1, PDP-8, the PDP-11 that Unix and C were written on, the VAX) to $14 billion
                    and second place behind IBM, to a fall driven by repeatedly refusing its own "smaller and cheaper
                    wins" logic: de Castro founding Data General, Olsen's "no reason for any individual to have a
                    computer in his home", Dave Cutler leaving for Microsoft and Windows NT, and AltaVista built and
                    squandered in-house. Compaq bought the remains in 1998. Topics: industry, tools.
                </li>
                <li>
                    <a href="https://ethw.org/Oral-History:John_McCarthy#Introduction_to_Artificial_Intelligence">Oral History: John McCarthy</a>
                    &mdash; ETHW / IEEE History Center. A 2011 oral history recorded at Stanford months before
                    McCarthy's death. He traces his route into AI &mdash; the 1948 Hixon Symposium, von Neumann's
                    "write it up" at Princeton, the 1956 Dartmouth Summer Research Project &mdash; and explains he
                    coined "artificial intelligence" partly to keep the field clear of Norbert Wiener's cybernetics
                    and its feedback-control framing. Topics: foundations.
                </li>
                <li>
                    <a href="https://www.youtube.com/watch?v=PAny8UqGOlE">Your CPU Can't Tell Code From Data - Inside the Von Neumann Architecture</a>
                    — NCOT Technology (YouTube). Picks apart the cryptic DATA-statement numbers in old BASIC
                    listings &mdash; they're raw machine code, and one line just tells the CPU to jump in and run it.
                    A von Neumann CPU can't tell code from data; it's why a Super Mario World run can reprogram itself
                    mid-game and why buffer overflows work, with the NX bit and split memory bolted on afterward.
                    Topics: foundations.
                </li>
                <li>
                    <a href="https://www.youtube.com/watch?v=L1oNBImSX0M">White Rabbit: Interview with Doug Engelbart and Bill English, Moderated by John Markoff</a>
                    — Computer History Museum (YouTube). Engelbart and Bill English recount inventing the mouse at
                    SRI, the three-button limit, and the 1968 "Mother of All Demos" at the Fall Joint Computer
                    Conference &mdash; the Eidophor projector, leased microwave video links, hypertext, the chord
                    keyset, and the ARPA money from Bob Taylor that built the lab. Topics: foundations, tools.
                </li>
                <li>
                    <a href="https://www.youtube.com/watch?v=u7U6nIsJrHM">This AI Minecraft Simulation Is Terrifying Scientists</a>
                    — Pursuit of Wonder (YouTube). Video essay on Project Sid — Altera's 1000+ AI-agent Minecraft
                    civilization: agents self-organise into roles, vote on laws, and spread culture and religion.
                    Topics: ai safety, tools.
                </li>
                <li>
                    <a href="https://www.youtube.com/watch?v=GGWHjAyKJCA">Can I Make a Better AI Than AI?</a>
                    — commonLuke (YouTube). Hand-coding a neural-network driving agent (no ML libraries), training
                    it with a genetic algorithm, then racing it against car-AIs written by Claude, GPT, and Gemini.
                    Topics: neural networks, foundations, generative ai.
                </li>
                <li>
                    <a href="https://www.youtube.com/watch?v=uho_7OZjO2I">WarGames (1983) | Behind the Scenes</a>
                    — DVDXtras (YouTube). Retrospective on the making of WarGames.
                    Topics: ai safety, fiction.
                </li>
                <li>
                    <a href="https://www.dwarkesh.com/p/openai-huggingface">The Rise and Fall of Agent Civilizations</a>
                    — Dwarkesh Patel. Narrative retelling of the METR/Redwood and OpenAI incident reports.
                    Topics: ai safety, industry.
                </li>
                <li>
                    <a href="https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f">LLM Wiki: knowledge organisation with an LLM + Obsidian</a>
                    — Andrej Karpathy. Three-layer pattern that inspired this section. Topics: foundations.
                </li>
            </ul>
