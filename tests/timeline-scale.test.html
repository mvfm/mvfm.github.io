<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Timeline Scale Tests</title>
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
    }
    h2 {
      margin-top: 0;
    }
    #summary {
      margin: 1rem 0;
      font-weight: bold;
      font-size: 1.1rem;
    }
    #results {
      margin-top: 1rem;
    }
    .test-result {
      padding: 0.75rem;
      margin: 0.5rem 0;
      border-left: 4px solid;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .pass {
      background: rgba(34, 197, 94, 0.1);
      border-color: #22c55e;
    }
    .fail {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
    }
  </style>
</head>
<body>
  <h2>Timeline Scale Tests</h2>
  <div id="summary"></div>
  <div id="results"></div>

  <script type="module">
    import { parseDate, createScale, ALPHA } from '../js/timeline/scale.js';
    import { SAMPLE } from './fixtures/timeline-sample.js';

    // Micro test framework
    const results = [];

    // expect() - assertion matcher
    function expect(val) {
      return {
        toBe(expected) {
          if (val !== expected) {
            throw new Error(`Expected ${JSON.stringify(val)} to be ${JSON.stringify(expected)}`);
          }
        },
        toEqual(expected) {
          if (!deepEqual(val, expected)) {
            throw new Error(`Expected ${JSON.stringify(val)} to equal ${JSON.stringify(expected)}`);
          }
        },
        toBeTruthy() {
          if (!val) {
            throw new Error(`Expected ${JSON.stringify(val)} to be truthy`);
          }
        },
        toBeFalsy() {
          if (val) {
            throw new Error(`Expected ${JSON.stringify(val)} to be falsy`);
          }
        }
      };
    }

    // Deep equality check helper
    function deepEqual(a, b) {
      if (a === b) return true;
      if (a == null || b == null) return false;
      if (typeof a !== 'object' || typeof b !== 'object') return false;
      const keysA = Object.keys(a);
      const keysB = Object.keys(b);
      if (keysA.length !== keysB.length) return false;
      return keysA.every(key => deepEqual(a[key], b[key]));
    }

    // test() - run a test and record result
    function test(name, fn) {
      let pass = true;
      let error = null;
      try {
        fn();
      } catch (e) {
        pass = false;
        error = e.message;
      }
      results.push({ name, pass, error });
    }

    function renderResults() {
      const summaryEl = document.getElementById('summary');
      const resultsEl = document.getElementById('results');

      const passed = results.filter(r => r.pass).length;
      const failed = results.filter(r => !r.pass).length;
      const allPassed = failed === 0;

      const icon = allPassed ? '✅' : '❌';
      summaryEl.textContent = `${passed} passed, ${failed} failed ${icon}`;

      results.forEach(result => {
        const div = document.createElement('div');
        div.className = `test-result ${result.pass ? 'pass' : 'fail'}`;
        div.textContent = result.pass
          ? `✓ ${result.name}`
          : `✗ ${result.name}\n  ${result.error}`;
        resultsEl.appendChild(div);
      });
    }

    const sorted = [...SAMPLE.events]; // fixture is already date-sorted

    test('parseDate: year only', () => {
      expect(parseDate({ year: 2000 })).toBe(2000);
    });
    test('parseDate: year + month + day', () => {
      // 1986 + 9/12 + 8/365
      expect(Math.abs(parseDate({ year: 1986, month: 10, day: 9 }) - (1986 + 9/12 + 8/365)) < 1e-9).toBeTruthy();
    });
    test('parseDate: missing year → NaN', () => {
      expect(Number.isNaN(parseDate({}))).toBeTruthy();
    });

    test('ALPHA is 0.6', () => { expect(ALPHA).toBe(0.6); });

    test('createScale: positions run 0..1 inclusive', () => {
      const s = createScale(sorted);
      expect(s.posOf(0)).toBe(0);
      expect(Math.abs(s.posOf(s.n - 1) - 1) < 1e-9).toBeTruthy();
    });

    test('createScale: positions are monotonic non-decreasing', () => {
      const s = createScale(sorted);
      let ok = true;
      for (let i = 1; i < s.n; i++) if (s.posOf(i) < s.posOf(i - 1)) ok = false;
      expect(ok).toBeTruthy();
    });

    test('createScale: alpha=0 → pure linear-time fractions', () => {
      const s = createScale(sorted, { alpha: 0 });
      const t0 = parseDate(sorted[0].start_date);
      const t1 = parseDate(sorted[sorted.length - 1].start_date);
      const idx = 4;
      const expected = (parseDate(sorted[idx].start_date) - t0) / (t1 - t0);
      expect(Math.abs(s.posOf(idx) - expected) < 1e-9).toBeTruthy();
    });

    test('createScale: alpha=1 → pure rank fractions', () => {
      const s = createScale(sorted, { alpha: 1 });
      expect(Math.abs(s.posOf(3) - 3 / (s.n - 1)) < 1e-9).toBeTruthy();
    });

    test('createScale: span 0 (all same date) → equal spacing, no NaN', () => {
      const same = [1, 2, 3, 4].map(() => ({ start_date: { year: 2020 } }));
      const s = createScale(same);
      expect(Math.abs(s.posOf(2) - 2 / 3) < 1e-9).toBeTruthy();
    });

    test('createScale: N=1 → single position [0]', () => {
      const s = createScale([{ start_date: { year: 2020 } }]);
      expect(s.n).toBe(1);
      expect(s.posOf(0)).toBe(0);
    });

    test('createScale: posOf out of range throws', () => {
      const s = createScale(sorted);
      let threw = false;
      try { s.posOf(999); } catch (e) { threw = e instanceof RangeError; }
      expect(threw).toBeTruthy();
    });

    renderResults();
  </script>
</body>
</html>
