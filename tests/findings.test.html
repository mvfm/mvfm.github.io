<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Findings Tests</title>
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
    }
    h2 {
      margin-top: 0;
    }
    #summary {
      margin: 1rem 0;
      font-weight: bold;
      font-size: 1.1rem;
    }
    #results {
      margin-top: 1rem;
    }
    .test-result {
      padding: 0.75rem;
      margin: 0.5rem 0;
      border-left: 4px solid;
      font-family: monospace;
    }
    .pass {
      background: rgba(34, 197, 94, 0.1);
      border-color: #22c55e;
    }
    .fail {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
    }
  </style>
</head>
<body>
  <h2>Findings Tests</h2>
  <div id="summary"></div>
  <div id="results"></div>

  <script type="module">
    import { getTopicColor } from '../js/topics.js';
    import {
      TOPIC_LABEL_OVERRIDES, deriveEventLabel, buildGraphModel, filterFindings
    } from '../js/findings-model.js';

    // Micro test framework
    const results = [];

    // expect() - assertion matcher
    function expect(val) {
      return {
        toBe(expected) {
          if (val !== expected) {
            throw new Error(`Expected ${JSON.stringify(val)} to be ${JSON.stringify(expected)}`);
          }
        },
        toEqual(expected) {
          if (!deepEqual(val, expected)) {
            throw new Error(`Expected ${JSON.stringify(val)} to equal ${JSON.stringify(expected)}`);
          }
        },
        toBeTruthy() {
          if (!val) {
            throw new Error(`Expected ${JSON.stringify(val)} to be truthy`);
          }
        },
        toBeFalsy() {
          if (val) {
            throw new Error(`Expected ${JSON.stringify(val)} to be falsy`);
          }
        }
      };
    }

    // Deep equality check helper
    function deepEqual(a, b) {
      if (a === b) return true;
      if (a == null || b == null) return false;
      if (typeof a !== 'object' || typeof b !== 'object') return false;
      const keysA = Object.keys(a);
      const keysB = Object.keys(b);
      if (keysA.length !== keysB.length) return false;
      return keysA.every(key => deepEqual(a[key], b[key]));
    }

    // waitFor() - poll until condition is true
    async function waitFor(condition, timeout = 2000, interval = 50) {
      const startTime = Date.now();
      while (Date.now() - startTime < timeout) {
        if (condition()) return;
        await new Promise(resolve => setTimeout(resolve, interval));
      }
      throw new Error(`Timeout waiting for condition after ${timeout}ms`);
    }

    // test() - run a test and record result
    async function test(name, fn) {
      let pass = true;
      let error = null;
      try {
        await fn();
      } catch (e) {
        pass = false;
        error = e.message;
      }
      results.push({ name, pass, error });
    }

    (async () => {
      await test('smoke', async () => { expect(1 + 1).toBe(2); });

      await test('getTopicColor: hue is index*18 in sorted list', async () => {
        const topics = ['b-topic', 'a-topic', 'c-topic']; // sorts to a,b,c
        expect(getTopicColor('a-topic', topics)).toBe('hsla(0, 70%, 45%, 1)');
        expect(getTopicColor('b-topic', topics)).toBe('hsla(18, 70%, 45%, 1)');
        expect(getTopicColor('c-topic', topics)).toBe('hsla(36, 70%, 45%, 1)');
      });

      await test('getTopicColor: disabled variant', async () => {
        expect(getTopicColor('a-topic', ['a-topic'], false)).toBe('hsla(0, 15%, 85%, 0.6)');
      });

      await test('getTopicColor: unknown topic → fallback, no throw', async () => {
        expect(getTopicColor('missing', ['a-topic'])).toBe('var(--clr-primary)');
        expect(getTopicColor('missing', ['a-topic'], false)).toBe('#cbd5e1');
      });

      await test('getTopicColor: empty/undefined allTopics → fallback', async () => {
        expect(getTopicColor('x', [])).toBe('var(--clr-primary)');
        expect(getTopicColor('x', undefined)).toBe('var(--clr-primary)');
      });

      // Task 2 + 3 append their tests below this line.

      await test('deriveEventLabel: un-slugify dashes + title case', async () => {
        expect(deriveEventLabel('hugging-face-breach')).toBe('Hugging Face Breach');
        expect(deriveEventLabel('backpropagation')).toBe('Backpropagation');
      });

      await test('deriveEventLabel: strips leading underscore (TimelineJS digit rule)', async () => {
        expect(deriveEventLabel('_2001-a-space-odyssey')).toBe('2001 A Space Odyssey');
      });

      await test('deriveEventLabel: overrides map wins when key present', async () => {
        const ov = { 'gpt-4': 'GPT-4', 'openai': 'OpenAI' };
        expect(deriveEventLabel('gpt-4', ov)).toBe('GPT-4');
        expect(deriveEventLabel('openai', ov)).toBe('OpenAI');
        expect(deriveEventLabel('some-other-event', ov)).toBe('Some Other Event');
      });

      await test('deriveEventLabel: shipped overrides map is empty', async () => {
        expect(Object.keys(TOPIC_LABEL_OVERRIDES).length).toBe(0);
      });

      await test('deriveEventLabel: empty/garbage input → empty string', async () => {
        expect(deriveEventLabel('')).toBe('');
        expect(deriveEventLabel(undefined)).toBe('');
      });

      // Task 3: buildGraphModel tests
      const F = [
        { slug: 'a', title: 'A', topics: ['ai safety', 'industry'],
          referenced_events: ['hugging-face-breach'], referenced_insights: ['shortcut'] },
        { slug: 'b', title: 'B', topics: ['industry'],
          referenced_events: ['hugging-face-breach', 'sandbox-escape'], referenced_insights: [] },
      ];
      const INS = [{ slug: 'shortcut', title: 'Shortcut' }];

      await test('buildGraphModel: one node per finding', async () => {
        const { nodes } = buildGraphModel(F, INS);
        const findingNodes = nodes.filter(n => n.type === 'finding');
        expect(findingNodes.length).toBe(2);
        expect(findingNodes.find(n => n.id === 'finding:a').label).toBe('A');
      });

      await test('buildGraphModel: distinct topic/event/insight nodes, deduped', async () => {
        const { nodes } = buildGraphModel(F, INS);
        expect(nodes.filter(n => n.type === 'topic').map(n => n.ref).sort()).toEqual(['ai safety', 'industry']);
        expect(nodes.filter(n => n.type === 'event').map(n => n.ref).sort()).toEqual(['hugging-face-breach', 'sandbox-escape']);
        expect(nodes.filter(n => n.type === 'insight').map(n => n.ref)).toEqual(['shortcut']);
      });

      await test('buildGraphModel: insight label from manifest, event label derived', async () => {
        const { nodes } = buildGraphModel(F, INS);
        expect(nodes.find(n => n.id === 'insight:shortcut').label).toBe('Shortcut');
        expect(nodes.find(n => n.id === 'event:hugging-face-breach').label).toBe('Hugging Face Breach');
      });

      await test('buildGraphModel: edge count = sum of topics+events+insights', async () => {
        const { edges } = buildGraphModel(F, INS);
        // a: 2 topics + 1 event + 1 insight = 4 ; b: 1 topic + 2 events + 0 = 3
        expect(edges.length).toBe(7);
      });

      await test('buildGraphModel: every edge source is a finding, no finding-finding/topic-event edges', async () => {
        const { edges } = buildGraphModel(F, INS);
        expect(edges.every(e => e.source.startsWith('finding:'))).toBeTruthy();
        expect(edges.some(e => e.target.startsWith('finding:'))).toBeFalsy();
      });

      await test('buildGraphModel: [] input → empty model', async () => {
        expect(buildGraphModel([], [])).toEqual({ nodes: [], edges: [] });
      });

      await test('buildGraphModel: unknown insight slug still gets a node (derived label)', async () => {
        const { nodes } = buildGraphModel(
          [{ slug: 'x', title: 'X', topics: [], referenced_events: [], referenced_insights: ['ghost-article'] }], []);
        expect(nodes.find(n => n.id === 'insight:ghost-article').label).toBe('Ghost Article');
      });

      // Task 6: filterFindings tests
      const FF = [
        { slug: 'a', title: 'Alpha', source: 'Site X', note: 'about safety', topics: ['ai safety', 'industry'] },
        { slug: 'b', title: 'Beta',  source: 'Blog Y', note: 'about chips',  topics: ['industry'] },
        { slug: 'c', title: 'Gamma', source: 'Alpha Weekly', note: '', topics: ['foundations'] },
      ];

      await test('filterFindings: no filter → all', async () => {
        expect(filterFindings(FF, { query: '', topics: [] }).length).toBe(3);
      });
      await test('filterFindings: query matches title/source/note, case-insensitive', async () => {
        expect(filterFindings(FF, { query: 'alpha', topics: [] }).map(f => f.slug).sort()).toEqual(['a', 'c']);
        expect(filterFindings(FF, { query: 'CHIPS', topics: [] }).map(f => f.slug)).toEqual(['b']);
      });
      await test('filterFindings: topics use AND semantics', async () => {
        expect(filterFindings(FF, { query: '', topics: ['industry'] }).map(f => f.slug).sort()).toEqual(['a', 'b']);
        expect(filterFindings(FF, { query: '', topics: ['ai safety', 'industry'] }).map(f => f.slug)).toEqual(['a']);
      });
      await test('filterFindings: query AND topics combined', async () => {
        expect(filterFindings(FF, { query: 'beta', topics: ['ai safety'] }).length).toBe(0);
      });

      renderResults();
    })();

    function renderResults() {
      const summaryEl = document.getElementById('summary');
      const resultsEl = document.getElementById('results');

      const passed = results.filter(r => r.pass).length;
      const failed = results.filter(r => !r.pass).length;
      const allPassed = failed === 0;

      // Render summary
      const icon = allPassed ? '✅' : '❌';
      summaryEl.textContent = `${passed} passed, ${failed} failed ${icon}`;

      // Render individual results
      results.forEach(result => {
        const div = document.createElement('div');
        div.className = `test-result ${result.pass ? 'pass' : 'fail'}`;
        div.textContent = result.pass
          ? `✓ ${result.name}`
          : `✗ ${result.name}\n  ${result.error}`;
        resultsEl.appendChild(div);
      });
    }
  </script>
</body>
</html>
