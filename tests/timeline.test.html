<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Timeline Component Tests</title>
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
    }
    h2 {
      margin-top: 0;
    }
    #summary {
      margin: 1rem 0;
      font-weight: bold;
      font-size: 1.1rem;
    }
    #results {
      margin-top: 1rem;
    }
    .test-result {
      padding: 0.75rem;
      margin: 0.5rem 0;
      border-left: 4px solid;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .pass {
      background: rgba(34, 197, 94, 0.1);
      border-color: #22c55e;
    }
    .fail {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
    }
  </style>
</head>
<body>
  <h2>Timeline Component Tests</h2>
  <div id="summary"></div>
  <div id="results"></div>

  <script type="module">
    // ---- paste harness ----
    import { Stage } from '../js/timeline/stage.js';
    import { Minimap } from '../js/timeline/minimap.js';
    import { createScale } from '../js/timeline/scale.js';
    import { SAMPLE } from './fixtures/timeline-sample.js';

    // Micro test framework
    const results = [];

    // expect() - assertion matcher
    function expect(val) {
      return {
        toBe(expected) {
          if (val !== expected) {
            throw new Error(`Expected ${JSON.stringify(val)} to be ${JSON.stringify(expected)}`);
          }
        },
        toEqual(expected) {
          if (!deepEqual(val, expected)) {
            throw new Error(`Expected ${JSON.stringify(val)} to equal ${JSON.stringify(expected)}`);
          }
        },
        toBeTruthy() {
          if (!val) {
            throw new Error(`Expected ${JSON.stringify(val)} to be truthy`);
          }
        },
        toBeFalsy() {
          if (val) {
            throw new Error(`Expected ${JSON.stringify(val)} to be falsy`);
          }
        }
      };
    }

    // Deep equality check helper
    function deepEqual(a, b) {
      if (a === b) return true;
      if (a == null || b == null) return false;
      if (typeof a !== 'object' || typeof b !== 'object') return false;
      const keysA = Object.keys(a);
      const keysB = Object.keys(b);
      if (keysA.length !== keysB.length) return false;
      return keysA.every(key => deepEqual(a[key], b[key]));
    }

    // test() - run a test and record result (sync or async fn); order preserved
    const pending = [];
    function test(name, fn) {
      const idx = results.length;
      results.push({ name, pass: true, error: null });
      pending.push(
        Promise.resolve().then(fn).then(
          () => {},
          (e) => { results[idx] = { name, pass: false, error: (e && e.message) || String(e) }; }
        )
      );
    }
    const runAll = () => Promise.all(pending);

    function renderResults() {
      const summaryEl = document.getElementById('summary');
      const resultsEl = document.getElementById('results');

      const passed = results.filter(r => r.pass).length;
      const failed = results.filter(r => !r.pass).length;
      const allPassed = failed === 0;

      const icon = allPassed ? '✅' : '❌';
      summaryEl.textContent = `${passed} passed, ${failed} failed ${icon}`;

      results.forEach(result => {
        const div = document.createElement('div');
        div.className = `test-result ${result.pass ? 'pass' : 'fail'}`;
        div.textContent = result.pass
          ? `✓ ${result.name}`
          : `✗ ${result.name}\n  ${result.error}`;
        resultsEl.appendChild(div);
      });
    }
    // ---- end harness ----

    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const withIds = SAMPLE.events.map(e => ({ ...e, unique_id: slug(e.text.headline) }));
    const noopSan = html => html.replace(/<(?!\/?(b|i|p|a|br)\b)[^>]*>/gi, '');
    const baseOpts = {
      sanitizeText: noopSan,
      colorForTopic: () => '#123456',
      insightArticlesFor: () => [],
      reducedMotion: true,
      onTextLinkClick(){}, onCartClick(){}, onCartOptionClick(){}, onInsightClick(){},
    };
    function mount() { const el = document.createElement('div'); document.body.appendChild(el); return el; }

    test('Stage.show renders headline + text', () => {
      const el = mount();
      const st = new Stage(el, baseOpts);
      st.show(withIds[1], 'initial');
      expect(el.querySelector('.ait-headline').textContent).toBe('Computing Machinery and Intelligence');
      expect(el.querySelector('.ait-text a')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show renders an <img> for image media', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[0], 'initial');
      expect(el.querySelector('.ait-media img')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show renders a YouTube facade (no iframe yet)', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[2], 'initial');
      expect(el.querySelector('.ait-yt-facade')).toBeTruthy();
      expect(el.querySelector('iframe')).toBeFalsy();
      st.destroy();
    });

    test('Stage.show renders a link card for wikipedia media', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[3], 'initial');
      expect(el.querySelector('.ait-linkcard')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show omits media panel when media is null', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[6], 'initial');
      expect(el.querySelector('.ait-media')).toBeFalsy();
      st.destroy();
    });

    test('Stage.show renders one topic-pill per topic', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[4], 'initial');
      expect(el.querySelectorAll('.ait-topics .topic-pill').length).toBe(2);
      st.destroy();
    });

    test('Stage.show renders cart + dropdown options for purchase_links', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[3], 'initial');
      expect(el.querySelector('.cart-btn')).toBeTruthy();
      expect(el.querySelectorAll('.purchase-dropdown a').length).toBe(2);
      st.destroy();
    });

    test('Stage.show renders archived ribbon when is_archived', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[3], 'initial');
      expect(el.querySelector('.archived-ribbon')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show renders insight chip + stripe when insightArticlesFor returns entries', () => {
      const el = mount();
      const st = new Stage(el, { ...baseOpts, insightArticlesFor: () => [{ slug: 'backprop', title: 'Backprop' }] });
      st.show(withIds[4], 'initial');
      expect(el.querySelector('.insight-ref-chip')).toBeTruthy();
      expect(el.querySelector('.insight-ref-stripe')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show sanitises disallowed tags in text', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show({ ...withIds[6], text: { headline: 'X', text: '<script>bad()<\/script><b>ok</b>' } }, 'initial');
      expect(el.querySelector('.ait-text script')).toBeFalsy();
      expect(el.querySelector('.ait-text b')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show keeps at most 2 card nodes on rapid calls', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      ['initial','next','next','next','prev'].forEach((d,i) => st.show(withIds[i], d));
      expect(el.querySelectorAll('.ait-card').length <= 2).toBeTruthy();
      st.destroy();
    });

    test('Stage.show coalesces rapid animated transitions without blanking the visible card', async () => {
      const el = mount();
      const st = new Stage(el, { ...baseOpts, reducedMotion: false });
      st.show(withIds[0], 'initial');
      st.show(withIds[1], 'next');
      st.show(withIds[0], 'prev');
      await new Promise(r => setTimeout(r, 500)); // past the 400ms hide-timer of every superseded transition
      const front = [...el.querySelectorAll('.ait-card')].find(c => !c.hidden);
      expect(front).toBeTruthy();
      expect(front.querySelector('.ait-headline').textContent).toBe('Discourse on the Method');
      expect(el.querySelectorAll('.ait-card').length <= 2).toBeTruthy();
      st.destroy();
    });

    test('Stage.destroy empties the mount', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[0], 'initial'); st.destroy();
      expect(el.children.length).toBe(0);
    });

    // ---- Task 4: Minimap render tests ----
    const PALETTE = { focusWindow:'#1baaff', playhead:'#0c2d6b', density:'#556688', eraBandA:'#eef', eraBandB:'#f7f9fc', yearLabel:'#889', laneLabel:'#889' };
    function mmMount() { const c = document.createElement('canvas'); c.style.width='600px'; c.style.height='92px'; document.body.appendChild(c); return c; }

    test('Minimap constructs and reports geometry', () => {
      const sc = createScale(withIds, { eras: SAMPLE.eras });
      const c = mmMount();
      const mm = new Minimap(c, { scale: sc, groups: ['research','industry','pop culture'],
        eras: SAMPLE.eras, groupOf: i => withIds[i].group, palette: PALETTE, reducedMotion: true,
        onZoom(){}, onScrub(){} });
      const d = mm._debug();
      expect(d.laneCount).toBe(3);
      expect(d.w > 0).toBeTruthy();
      mm.destroy();
    });

    test('Minimap.setFocus updates reported focus', () => {
      const sc = createScale(withIds);
      const c = mmMount();
      const mm = new Minimap(c, { scale: sc, groups:['research','industry','pop culture'], eras:[], groupOf:i=>withIds[i].group, palette:PALETTE, reducedMotion:true, onZoom(){}, onScrub(){} });
      mm.setFocus({ f0: 0.25, f1: 0.75 });
      expect(Math.abs(mm._debug().focus.f0 - 0.25) < 1e-9).toBeTruthy();
      mm.destroy();
    });

    test('Minimap.setCurrent updates reported current', () => {
      const sc = createScale(withIds);
      const c = mmMount();
      const mm = new Minimap(c, { scale: sc, groups:['research','industry','pop culture'], eras:[], groupOf:i=>withIds[i].group, palette:PALETTE, reducedMotion:true, onZoom(){}, onScrub(){} });
      mm.setCurrent(5);
      expect(mm._debug().current).toBe(5);
      mm.destroy();
    });

    test('Minimap.destroy is idempotent and detaches', () => {
      const sc = createScale(withIds);
      const c = mmMount();
      const mm = new Minimap(c, { scale: sc, groups:['research','industry','pop culture'], eras:[], groupOf:i=>withIds[i].group, palette:PALETTE, reducedMotion:true, onZoom(){}, onScrub(){} });
      mm.destroy(); mm.destroy();
      expect(true).toBeTruthy(); // no throw
    });

    test('Minimap dragging the playhead scrubs (onScrub with an index)', () => {
      const sc = createScale(withIds);
      const c = mmMount();
      let scrubbed = null;
      const mm = new Minimap(c, { scale: sc, groups:['research','industry','pop culture'], eras:[], groupOf:i=>withIds[i].group, palette:PALETTE, reducedMotion:true, onZoom(){}, onScrub(i){ scrubbed = i; } });
      mm.setFocus({ f0: 0, f1: 1 });   // full window so the playhead x is unclamped
      mm.setCurrent(4);
      const rect = c.getBoundingClientRect();
      const px = mm._plotX(sc.posOf(4));            // where the playhead is drawn
      const tx = mm._plotX(sc.posOf(7));            // drag target near the end
      c.dispatchEvent(new PointerEvent('pointerdown', { offsetX: px, clientX: rect.left + px, clientY: rect.top + 20, pointerId: 1, bubbles: true }));
      window.dispatchEvent(new PointerEvent('pointermove', { clientX: rect.left + tx, clientY: rect.top + 20, pointerId: 1, bubbles: true }));
      window.dispatchEvent(new PointerEvent('pointerup', { pointerId: 1, bubbles: true }));
      expect(Number.isInteger(scrubbed)).toBeTruthy();
      expect(scrubbed > 4).toBeTruthy();
      // focus window must not have moved in playhead mode
      expect(mm._debug().focus.f0 === 0 && mm._debug().focus.f1 === 1).toBeTruthy();
      mm.destroy();
    });

    // ---- Task 5: AITimeline orchestrator tests ----
    import { AITimeline } from '../js/timeline/timeline.js';

    const aiOpts = {
      colorForTopic: () => '#123', insightArticlesFor: () => [], sanitizeText: noopSan,
      track: () => {}, reducedMotion: true,
      slugify: s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''),
      onCartClick(){}, onCartOptionClick(){}, onInsightClick(){}, onTextLinkClick(){},
    };

    test('AITimeline.setEvents renders exactly one card', async () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      await Promise.resolve();
      expect(el.querySelectorAll('.ait-card:not([hidden])').length).toBe(1);
      t.destroy();
    });

    test('AITimeline defaults currentIndex to the newest event', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      expect(t.getCurrentSlide().data.text.headline).toBe('GPT-4');
      t.destroy();
    });

    test('AITimeline.goToId moves the current card and fires change', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      let fired = null;
      t.on('change', e => { fired = e; });
      t.goToId('the-perceptron');
      expect(t.getCurrentSlide().data.text.headline).toBe('The Perceptron');
      expect(fired.unique_id).toBe('the-perceptron');
    });

    test('AITimeline.goToId with unknown slug is a no-op', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      const before = t.getCurrentSlide().data.text.headline;
      t.goToId('does-not-exist');
      expect(t.getCurrentSlide().data.text.headline).toBe(before);
      t.destroy();
    });

    test('AITimeline.setEvents(subset) rebuilds and clamps currentIndex', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      const subset = { ...SAMPLE, events: SAMPLE.events.slice(0, 3) };
      t.setEvents(structuredClone(subset));
      expect(t.getCurrentSlide().data.text.headline).toBe('The Perceptron'); // newest of the 3
      t.destroy();
    });

    test('AITimeline attaches unique_id to every event', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      expect(t.getCurrentSlide().data.unique_id).toBe('gpt-4');
      t.destroy();
    });

    test('AITimeline.destroy empties the mount and is idempotent', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      t.destroy(); t.destroy();
      expect(el.querySelector('.ait-card')).toBeFalsy();
    });

    test('AITimeline no-op goToId (current slug) emits no change', async () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      await Promise.resolve();
      const currentSlug = t.getCurrentSlide().data.unique_id;
      let count = 0;
      t.on('change', () => { count++; });
      t.goToId(currentSlug);
      expect(count).toBe(0);
      expect(t.getCurrentSlide().data.unique_id).toBe(currentSlug);
      t.destroy();
    });

    test('AITimeline fires initial change on a microtask after setEvents', async () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      let fired = null;
      t.setEvents(structuredClone(SAMPLE));
      t.on('change', e => { fired = e; });   // attached AFTER setEvents, like main.js
      expect(fired).toBe(null);
      await Promise.resolve();
      expect(fired && fired.unique_id).toBe('gpt-4');
      t.destroy();
    });

    runAll().then(renderResults);
  </script>
</body>
</html>
