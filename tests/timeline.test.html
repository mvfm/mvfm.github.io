<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Timeline Component Tests</title>
  <!-- load the real component CSS so .ait-* visual state is real and computed
       styles can be asserted (FIX 2). Harness rules below are scoped to
       #tl-tests to out-specify style.css's bare element selectors. -->
  <link rel="stylesheet" href="/style.css">
  <style>
    #tl-tests {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
    }
    #tl-tests h2 {
      margin-top: 0;
      color: #e2e8f0;
    }
    #tl-tests #summary {
      margin: 1rem 0;
      font-weight: bold;
      font-size: 1.1rem;
    }
    #tl-tests #results {
      margin-top: 1rem;
    }
    #tl-tests .test-result {
      padding: 0.75rem;
      margin: 0.5rem 0;
      border-left: 4px solid;
      font-family: monospace;
      white-space: pre-wrap;
      color: #e2e8f0;
    }
    #tl-tests .pass {
      background: rgba(34, 197, 94, 0.1);
      border-color: #22c55e;
    }
    #tl-tests .fail {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
    }
  </style>
</head>
<body id="tl-tests">
  <h2>Timeline Component Tests</h2>
  <div id="summary"></div>
  <div id="results"></div>

  <script type="module">
    // ---- paste harness ----
    import { Stage } from '../js/timeline/stage.js';
    import { Minimap } from '../js/timeline/minimap.js';
    import { createScale } from '../js/timeline/scale.js';
    import { MediaOverlay } from '../js/timeline/overlay.js';
    import { SAMPLE } from './fixtures/timeline-sample.js';

    // Micro test framework
    const results = [];

    // expect() - assertion matcher
    function expect(val) {
      return {
        toBe(expected) {
          if (val !== expected) {
            throw new Error(`Expected ${JSON.stringify(val)} to be ${JSON.stringify(expected)}`);
          }
        },
        toEqual(expected) {
          if (!deepEqual(val, expected)) {
            throw new Error(`Expected ${JSON.stringify(val)} to equal ${JSON.stringify(expected)}`);
          }
        },
        toBeTruthy() {
          if (!val) {
            throw new Error(`Expected ${JSON.stringify(val)} to be truthy`);
          }
        },
        toBeFalsy() {
          if (val) {
            throw new Error(`Expected ${JSON.stringify(val)} to be falsy`);
          }
        }
      };
    }

    // Deep equality check helper
    function deepEqual(a, b) {
      if (a === b) return true;
      if (a == null || b == null) return false;
      if (typeof a !== 'object' || typeof b !== 'object') return false;
      const keysA = Object.keys(a);
      const keysB = Object.keys(b);
      if (keysA.length !== keysB.length) return false;
      return keysA.every(key => deepEqual(a[key], b[key]));
    }

    // test() - run a test and record result (sync or async fn); order preserved
    const pending = [];
    function test(name, fn) {
      const idx = results.length;
      results.push({ name, pass: true, error: null });
      pending.push(
        Promise.resolve().then(fn).then(
          () => {},
          (e) => { results[idx] = { name, pass: false, error: (e && e.message) || String(e) }; }
        )
      );
    }
    const runAll = () => Promise.all(pending);

    function renderResults() {
      const summaryEl = document.getElementById('summary');
      const resultsEl = document.getElementById('results');

      const passed = results.filter(r => r.pass).length;
      const failed = results.filter(r => !r.pass).length;
      const allPassed = failed === 0;

      const icon = allPassed ? '✅' : '❌';
      summaryEl.textContent = `${passed} passed, ${failed} failed ${icon}`;

      results.forEach(result => {
        const div = document.createElement('div');
        div.className = `test-result ${result.pass ? 'pass' : 'fail'}`;
        div.textContent = result.pass
          ? `✓ ${result.name}`
          : `✗ ${result.name}\n  ${result.error}`;
        resultsEl.appendChild(div);
      });
    }
    // ---- end harness ----

    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const withIds = SAMPLE.events.map(e => ({ ...e, unique_id: slug(e.text.headline) }));
    const noopSan = html => html.replace(/<(?!\/?(b|i|p|a|br)\b)[^>]*>/gi, '');
    const baseOpts = {
      sanitizeText: noopSan,
      colorForTopic: () => '#123456',
      insightArticlesFor: () => [],
      reducedMotion: true,
      onTextLinkClick(){}, onCartClick(){}, onCartOptionClick(){}, onInsightClick(){},
    };
    function mount() { const el = document.createElement('div'); document.body.appendChild(el); return el; }

    test('Stage renders API Findings backlinks, tracks clicks, and clears stale links', () => {
      const el = mount(); let clicked = null;
      const st = new Stage(el, { ...baseOpts,
        insightArticlesFor: () => [{ slug: 'forwardpropagation', title: 'Forward Propagation' }],
        onFindingClick: (link, ev) => {
        ev.preventDefault(); clicked = link.dataset;
      } });
      st.show({ ...withIds[1], related_findings: [{ id: 42, slug: 'mccarthy',
        title: 'McCarthy <oral history>', source: 'IEEE' }] }, 'initial');
      const link = el.querySelector('.finding-ref-chip');
      expect(getComputedStyle(el.querySelector('.finding-ref-stripe')).left).toBe('0px');
      expect(getComputedStyle(el.querySelector('.insight-ref-stripe')).right).toBe('0px');
      expect(link.getAttribute('href')).toBe('/findings/#mccarthy');
      expect(link.textContent).toBe('◈ McCarthy <oral history>');
      expect(link.closest('.ait-body')).toBeFalsy();
      expect(getComputedStyle(link.parentElement).position).toBe('absolute');
      expect(link.parentElement.className).toBe('ait-finding-chips');
      expect(el.querySelector('.insight-ref-chip').parentElement.className).toBe('ait-chips');
      expect(getComputedStyle(link.parentElement).left).toBe('20px');
      expect(getComputedStyle(el.querySelector('.insight-ref-chip').parentElement).right).toBe('20px');
      expect(getComputedStyle(link).borderRadius).toBe(getComputedStyle(el.querySelector('.insight-ref-chip')).borderRadius);
      expect(link.querySelector('oral')).toBeFalsy();
      link.click();
      expect(clicked.findingSlug).toBe('mccarthy');
      expect(clicked.eventId).toBe(withIds[1].unique_id);
      st.show(withIds[2], 'initial');
      expect(el.querySelector('article:not([hidden]) .finding-ref-chip')).toBeFalsy();
      expect(el.querySelector('article:not([hidden]) .finding-ref-stripe')).toBeFalsy();
      st.destroy(); el.remove();
    });

      const el = mount();
      const st = new Stage(el, baseOpts);
      st.show(withIds[1], 'initial');
      expect(el.querySelector('.ait-headline').textContent).toBe('Computing Machinery and Intelligence');
      expect(el.querySelector('.ait-text a')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show renders an <img> for image media', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[0], 'initial');
      expect(el.querySelector('.ait-media img')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show renders a YouTube facade (no iframe yet)', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[2], 'initial');
      expect(el.querySelector('.ait-yt-facade')).toBeTruthy();
      expect(el.querySelector('iframe')).toBeFalsy();
      st.destroy();
    });

    test('Stage.show renders a link card for wikipedia media', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[3], 'initial');
      expect(el.querySelector('.ait-linkcard')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show omits media panel when media is null', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[6], 'initial');
      expect(el.querySelector('.ait-media')).toBeFalsy();
      st.destroy();
    });

    test('Stage.show renders one topic-pill per topic', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[4], 'initial');
      expect(el.querySelectorAll('.ait-topics .topic-pill').length).toBe(2);
      st.destroy();
    });

    test('Stage.show renders cart + dropdown options for purchase_links', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[3], 'initial');
      expect(el.querySelector('.cart-btn')).toBeTruthy();
      expect(el.querySelectorAll('.purchase-dropdown a').length).toBe(2);
      st.destroy();
    });

    test('Stage.show renders archived ribbon when is_archived', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[3], 'initial');
      expect(el.querySelector('.archived-ribbon')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show renders insight chip + stripe when insightArticlesFor returns entries', () => {
      const el = mount();
      const st = new Stage(el, { ...baseOpts, insightArticlesFor: () => [{ slug: 'backprop', title: 'Backprop' }] });
      st.show(withIds[4], 'initial');
      expect(el.querySelector('.insight-ref-chip')).toBeTruthy();
      expect(el.querySelector('.insight-ref-stripe')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show sanitises disallowed tags in text', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show({ ...withIds[6], text: { headline: 'X', text: '<script>bad()<\/script><b>ok</b>' } }, 'initial');
      expect(el.querySelector('.ait-text script')).toBeFalsy();
      expect(el.querySelector('.ait-text b')).toBeTruthy();
      st.destroy();
    });

    test('Stage.show keeps at most 2 card nodes on rapid calls', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      ['initial','next','next','next','prev'].forEach((d,i) => st.show(withIds[i], d));
      expect(el.querySelectorAll('.ait-card').length <= 2).toBeTruthy();
      st.destroy();
    });

    test('Stage.show coalesces rapid animated transitions without blanking the visible card', async () => {
      const el = mount();
      const st = new Stage(el, { ...baseOpts, reducedMotion: false });
      st.show(withIds[0], 'initial');
      st.show(withIds[1], 'next');
      st.show(withIds[0], 'prev');
      await new Promise(r => setTimeout(r, 500)); // past the 400ms hide-timer of every superseded transition
      const front = [...el.querySelectorAll('.ait-card')].find(c => !c.hidden);
      expect(front).toBeTruthy();
      expect(front.querySelector('.ait-headline').textContent).toBe('Discourse on the Method');
      expect(el.querySelectorAll('.ait-card').length <= 2).toBeTruthy();
      // the visible front card must NOT be stuck in the leave state (the real
      // FIX-1 bug: a superseded transition left ait-leave on the reused card,
      // whose opacity:0 / translateX(-24px) then wins over a class-less card)
      expect(front.classList.contains('ait-leave')).toBe(false);
      expect(front.classList.contains('ait-leave-prev')).toBe(false);
      // ...and once its transition has settled, computed opacity is visible.
      // (style.css is loaded here; skip if a transition is still pending — a
      // backgrounded test tab pauses CSS transitions and would read 0.)
      if (front.getAnimations().length === 0) {
        expect(getComputedStyle(front).opacity !== '0').toBeTruthy();
      }
      st.destroy();
    });

    test('Stage.destroy empties the mount', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      st.show(withIds[0], 'initial'); st.destroy();
      expect(el.children.length).toBe(0);
    });

    // ---- Task 4: Minimap render tests ----
    const PALETTE = { focusWindow:'#1baaff', playhead:'#0c2d6b', density:'#556688', eraBandA:'#eef', eraBandB:'#f7f9fc', yearLabel:'#889', laneLabel:'#889' };
    function mmMount() { const c = document.createElement('canvas'); c.style.width='600px'; c.style.height='92px'; document.body.appendChild(c); return c; }

    test('Minimap constructs and reports geometry', () => {
      const sc = createScale(withIds, { eras: SAMPLE.eras });
      const c = mmMount();
      const mm = new Minimap(c, { scale: sc, groups: ['research','industry','pop culture'],
        eras: SAMPLE.eras, groupOf: i => withIds[i].group, palette: PALETTE, reducedMotion: true,
        onZoom(){}, onScrub(){} });
      const d = mm._debug();
      expect(d.laneCount).toBe(3);
      expect(d.w > 0).toBeTruthy();
      mm.destroy();
    });

    test('Minimap.setFocus updates reported focus', () => {
      const sc = createScale(withIds);
      const c = mmMount();
      const mm = new Minimap(c, { scale: sc, groups:['research','industry','pop culture'], eras:[], groupOf:i=>withIds[i].group, palette:PALETTE, reducedMotion:true, onZoom(){}, onScrub(){} });
      mm.setFocus({ f0: 0.25, f1: 0.75 });
      expect(Math.abs(mm._debug().focus.f0 - 0.25) < 1e-9).toBeTruthy();
      mm.destroy();
    });

    test('Minimap.setCurrent updates reported current', () => {
      const sc = createScale(withIds);
      const c = mmMount();
      const mm = new Minimap(c, { scale: sc, groups:['research','industry','pop culture'], eras:[], groupOf:i=>withIds[i].group, palette:PALETTE, reducedMotion:true, onZoom(){}, onScrub(){} });
      mm.setCurrent(5);
      expect(mm._debug().current).toBe(5);
      mm.destroy();
    });

    test('Minimap.destroy is idempotent and detaches', () => {
      const sc = createScale(withIds);
      const c = mmMount();
      const mm = new Minimap(c, { scale: sc, groups:['research','industry','pop culture'], eras:[], groupOf:i=>withIds[i].group, palette:PALETTE, reducedMotion:true, onZoom(){}, onScrub(){} });
      mm.destroy(); mm.destroy();
      expect(true).toBeTruthy(); // no throw
    });

    test('Minimap dragging the playhead scrubs (onScrub with an index)', () => {
      const sc = createScale(withIds);
      const c = mmMount();
      let scrubbed = null;
      const mm = new Minimap(c, { scale: sc, groups:['research','industry','pop culture'], eras:[], groupOf:i=>withIds[i].group, palette:PALETTE, reducedMotion:true, onZoom(){}, onScrub(i){ scrubbed = i; } });
      mm.setFocus({ f0: 0, f1: 1 });   // full window so the playhead x is unclamped
      mm.setCurrent(4);
      const rect = c.getBoundingClientRect();
      const px = mm._plotX(sc.posOf(4));            // where the playhead is drawn
      const tx = mm._plotX(sc.posOf(7));            // drag target near the end
      c.dispatchEvent(new PointerEvent('pointerdown', { offsetX: px, clientX: rect.left + px, clientY: rect.top + 20, pointerId: 1, bubbles: true }));
      window.dispatchEvent(new PointerEvent('pointermove', { clientX: rect.left + tx, clientY: rect.top + 20, pointerId: 1, bubbles: true }));
      window.dispatchEvent(new PointerEvent('pointerup', { pointerId: 1, bubbles: true }));
      expect(Number.isInteger(scrubbed)).toBeTruthy();
      expect(scrubbed > 4).toBeTruthy();
      // focus window must not have moved in playhead mode
      expect(mm._debug().focus.f0 === 0 && mm._debug().focus.f1 === 1).toBeTruthy();
      mm.destroy();
    });

    // ---- Task 5: AITimeline orchestrator tests ----
    import { AITimeline } from '../js/timeline/timeline.js';

    const aiOpts = {
      colorForTopic: () => '#123', insightArticlesFor: () => [], sanitizeText: noopSan,
      track: () => {}, reducedMotion: true,
      slugify: s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''),
      onCartClick(){}, onCartOptionClick(){}, onInsightClick(){}, onTextLinkClick(){},
    };

    test('AITimeline nets zero window/document listeners across construct→setEvents→destroy', () => {
      // NOTE: run fully synchronously (no await) — the shims below are global, so
      // yielding to the microtask queue here would let sibling async tests build
      // their own AITimeline/Minimap and inflate these counts. Spec §13.2 only
      // needs construct→setEvents→destroy to be listener-neutral, which is sync.
      const el = mount();
      const orig = {
        winAdd: window.addEventListener, winRem: window.removeEventListener,
        docAdd: document.addEventListener, docRem: document.removeEventListener,
      };
      const net = {};
      const bump = (scope, type, d) => { const k = scope + ':' + type; net[k] = (net[k] || 0) + d; };
      try {
        window.addEventListener = function (type, ...rest) { bump('win', type, 1); return orig.winAdd.call(this, type, ...rest); };
        window.removeEventListener = function (type, ...rest) { bump('win', type, -1); return orig.winRem.call(this, type, ...rest); };
        document.addEventListener = function (type, ...rest) { bump('doc', type, 1); return orig.docAdd.call(this, type, ...rest); };
        document.removeEventListener = function (type, ...rest) { bump('doc', type, -1); return orig.docRem.call(this, type, ...rest); };

        const t = new AITimeline(el, aiOpts);
        t.setEvents(structuredClone(SAMPLE));
        t.destroy();
      } finally {
        window.addEventListener = orig.winAdd;
        window.removeEventListener = orig.winRem;
        document.addEventListener = orig.docAdd;
        document.removeEventListener = orig.docRem;
      }
      const leaked = Object.entries(net).filter(([, v]) => v > 0);
      expect(leaked.length === 0 ? 'none' : JSON.stringify(leaked)).toBe('none');
    });

    test('AITimeline.setEvents renders exactly one card', async () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      await Promise.resolve();
      expect(el.querySelectorAll('.ait-card:not([hidden])').length).toBe(1);
      t.destroy();
    });

    test('AITimeline defaults currentIndex to the newest event', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      expect(t.getCurrentSlide().data.text.headline).toBe('GPT-4');
      t.destroy();
    });

    test('AITimeline.goToId moves the current card and fires change', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      let fired = null;
      t.on('change', e => { fired = e; });
      t.goToId('the-perceptron');
      expect(t.getCurrentSlide().data.text.headline).toBe('The Perceptron');
      expect(fired.unique_id).toBe('the-perceptron');
    });

    test('AITimeline.goToId with unknown slug is a no-op', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      const before = t.getCurrentSlide().data.text.headline;
      t.goToId('does-not-exist');
      expect(t.getCurrentSlide().data.text.headline).toBe(before);
      t.destroy();
    });

    test('AITimeline.setEvents(subset) rebuilds and clamps currentIndex', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      const subset = { ...SAMPLE, events: SAMPLE.events.slice(0, 3) };
      t.setEvents(structuredClone(subset));
      expect(t.getCurrentSlide().data.text.headline).toBe('The Perceptron'); // newest of the 3
      t.destroy();
    });

    test('AITimeline attaches unique_id to every event', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      expect(t.getCurrentSlide().data.unique_id).toBe('gpt-4');
      t.destroy();
    });

    test('AITimeline.destroy empties the mount and is idempotent', () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      t.destroy(); t.destroy();
      expect(el.querySelector('.ait-card')).toBeFalsy();
    });

    test('AITimeline no-op goToId (current slug) emits no change', async () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      t.setEvents(structuredClone(SAMPLE));
      await Promise.resolve();
      const currentSlug = t.getCurrentSlide().data.unique_id;
      let count = 0;
      t.on('change', () => { count++; });
      t.goToId(currentSlug);
      expect(count).toBe(0);
      expect(t.getCurrentSlide().data.unique_id).toBe(currentSlug);
      t.destroy();
    });

    test('AITimeline fires initial change on a microtask after setEvents', async () => {
      const el = mount();
      const t = new AITimeline(el, aiOpts);
      let fired = null;
      t.setEvents(structuredClone(SAMPLE));
      t.on('change', e => { fired = e; });   // attached AFTER setEvents, like main.js
      expect(fired).toBe(null);
      await Promise.resolve();
      expect(fired && fired.unique_id).toBe('gpt-4');
      t.destroy();
    });

    // ---- MediaOverlay ----
    function overlayHost() {
      const host = document.createElement('div');
      host.style.cssText = 'position:relative;width:300px;height:300px';
      document.body.appendChild(host);
      return host;
    }
    const mkOverlay = (host, extra = {}) => new MediaOverlay({
      host, label: 'Quotes', className: 'ait-quote-overlay',
      items: [{ slug: 'a', text: 'First' }, { slug: 'b', text: 'Second' }, { slug: 'c', text: 'Third' }],
      renderItem: (it) => { const p = document.createElement('p'); p.textContent = it.text; return p; },
      linkFor: (it) => ({ href: `/quotes/#${it.slug}`, label: 'Read in Quotes →' }),
      ...extra,
    });

    test('MediaOverlay opens on the first item with a counter and link', () => {
      const host = overlayHost(); const ov = mkOverlay(host);
      ov.open();
      const el = host.querySelector('.ait-overlay');
      expect(el.getAttribute('role')).toBe('dialog');
      expect(el.querySelector('.ait-overlay-scroll').textContent).toBe('First');
      expect(el.querySelector('.ait-overlay-count').textContent).toBe('Quote 1 of 3');
      const dots = el.querySelectorAll('.ait-overlay-dot');
      expect(dots.length).toBe(3);
      expect(el.querySelectorAll('.ait-overlay-dot.active').length).toBe(1);
      expect(dots[0].classList.contains('active')).toBe(true);
      expect(el.querySelector('.ait-overlay-dots').getAttribute('aria-hidden')).toBe('true');
      expect(el.querySelector('.ait-overlay-link').getAttribute('href')).toBe('/quotes/#a');
      expect(host.classList.contains('has-overlay')).toBe(true);
      ov.destroy(); host.remove();
    });
    test('MediaOverlay keeps the decorative mark outside the scroll region', () => {
      const host = overlayHost(); const ov = mkOverlay(host); ov.open();
      const el = host.querySelector('.ait-overlay');
      const mark = el.querySelector('.ait-overlay-mark');
      expect(mark.parentElement).toBe(el);
      expect(mark.getAttribute('aria-hidden')).toBe('true');
      expect(el.querySelector('.ait-overlay-scroll').contains(mark)).toBe(false);
      ov.destroy(); host.remove();
    });
    test('MediaOverlay pager steps, wraps, and reports navigation', () => {
      const host = overlayHost(); const navs = [];
      const ov = mkOverlay(host, { onNav: (n) => navs.push(n.index) }); ov.open();
      const el = host.querySelector('.ait-overlay');
      el.querySelector('.ait-overlay-next').click();
      expect(el.querySelector('.ait-overlay-scroll').textContent).toBe('Second');
      el.querySelector('.ait-overlay-prev').click(); el.querySelector('.ait-overlay-prev').click();
      expect(el.querySelector('.ait-overlay-scroll').textContent).toBe('Third');
      expect(navs).toEqual([1, 0, 2]);
      expect(el.querySelectorAll('.ait-overlay-dot')[2].classList.contains('active')).toBe(true);
      expect(el.querySelectorAll('.ait-overlay-dot.active').length).toBe(1);
      expect(el.querySelector('.ait-overlay-count').textContent).toBe('Quote 3 of 3');
      ov.destroy(); host.remove();
    });
    test('MediaOverlay hides the pager for a single item', () => {
      const host = overlayHost();
      const ov = mkOverlay(host, { items: [{ slug: 'a', text: 'Only' }] }); ov.open();
      const el = host.querySelector('.ait-overlay');
      expect(el.querySelector('.ait-overlay-prev').hidden).toBe(true);
      expect(el.querySelector('.ait-overlay-next').hidden).toBe(true);
      expect(el.querySelector('.ait-overlay-count').hidden).toBe(true);

    test('Quote text auto-fits: short quotes keep full size, medium quotes shrink to fit, huge ones stop at the floor and scroll', () => {
      const el = mount(); const st = new Stage(el, baseOpts);
      const open = (text) => {
        st.show({ ...withIds[1], related_quotes: [{ id: 1, slug: 'q', speaker: 'S', text }] }, 'initial');

        const pill = card.querySelector('.ait-quote-pill'); pill.click();
        const sc = card.querySelector('.ait-overlay-scroll'); const t = card.querySelector('.ait-quote-text');
        return { sc, t, over: sc.scrollHeight > sc.clientHeight + 1, px: parseFloat(getComputedStyle(t).fontSize), inline: t.style.fontSize };
      };
      const short = open('Short quote.');
      expect(short.inline).toBe('');
      expect(short.over).toBe(false);
      const full = short.px;
      let found = null;
      for (let n = 20; n <= 600 && !found; n += 20) {
        const r = open('word '.repeat(n).trim());
        if (r.inline !== '' && !r.over) found = r;
      }
      expect(!!found).toBe(true);
      expect(found.px < full && found.px >= 17).toBe(true);
      const huge = open('Very long quote. '.repeat(400));
      expect(huge.px).toBe(17);
      expect(huge.over).toBe(true);
      st.destroy(); el.remove();

    test('Mobile quote overlay spans the card width even with a narrow image', async () => {
      const frame = document.createElement('iframe');
      frame.title = 'Mobile quote overlay test'; frame.style.cssText = 'width:375px;height:812px;border:0';
      const svg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="200"><rect width="100" height="200" fill="#888"/></svg>');
      frame.srcdoc = `<!doctype html><html><head><link rel="stylesheet" href="/style.css"></head>
        <body><div id="stage" class="ait-stage-host"></div><script type="module">
        import { Stage } from '/js/timeline/stage.js';
        const stage = new Stage(document.getElementById('stage'), {
          sanitizeText: s => s, colorForTopic: () => '#333', reducedMotion: true, insightArticlesFor: () => []
        });
        stage.show({unique_id:'narrow',start_date:{year:1950},
          text:{headline:'Narrow Image',text:'Body.'},
          media:{url:${JSON.stringify(svg)}},
          related_quotes:[{id:1,slug:'q1',speaker:'Someone',text:'A long quote that keeps going and going. '.repeat(12)+'Supercalifragilisticexpialidocious'.repeat(3)}]
        },'initial');
        document.querySelector('.ait-quote-pill').click();
        document.body.dataset.ready = 'true';
        <\/script>`;
      document.body.appendChild(frame);
      try {
        await new Promise((res, rej) => {
          const t0 = Date.now();
          (function poll() {
            if (frame.contentDocument?.body?.dataset.ready) return res();
            if (Date.now() - t0 > 5000) return rej(new Error('iframe timeout'));
            setTimeout(poll, 25);
          })();
        });
        const doc = frame.contentDocument;
        const ov = doc.querySelector('.ait-overlay');
        expect(!!ov).toBe(true);
        const w = ov.getBoundingClientRect().width;
        expect(w >= 300).toBe(true);
        const sc = doc.querySelector('.ait-overlay-scroll');
        expect(sc.scrollWidth <= sc.clientWidth + 1).toBe(true);
      } finally { frame.remove(); }
    });
